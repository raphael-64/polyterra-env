<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyterra Replay Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .file-selector {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 10px 25px;
            background: #4CAF50;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .file-label:hover {
            background: #45a049;
        }

        .main-content {
            display: none;
        }

        .main-content.active {
            display: grid;
            grid-template-columns: auto 350px;
            gap: 20px;
        }

        .game-view {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .map-container {
            background: #0f1419;
            border-radius: 8px;
            padding: 10px;
            display: inline-block;
        }

        .map-grid {
            display: grid;
            gap: 1px;
            background: #000;
            border: 2px solid #333;
        }

        .map-tile {
            width: 40px;
            height: 40px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .map-tile:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Terrain colors */
        .terrain-0 { background: #1a1a1a; } /* None */
        .terrain-1 { background: #3498db; } /* Water */
        .terrain-2 { background: #2980b9; } /* Ocean */
        .terrain-3 { background: #27ae60; } /* Field */
        .terrain-4 { background: #7f8c8d; } /* Mountain */
        .terrain-5 { background: #229954; } /* Forest */
        .terrain-6 { background: #d4f1f4; } /* Ice */

        /* Owner overlays */
        .owner-1 { box-shadow: inset 0 0 0 3px #ff6b6b; }
        .owner-2 { box-shadow: inset 0 0 0 3px #4ecdc4; }
        .owner-3 { box-shadow: inset 0 0 0 3px #ffe66d; }
        .owner-4 { box-shadow: inset 0 0 0 3px #a8e6cf; }

        /* Fog of war */
        .unexplored {
            background: #1a1a1a !important;
            opacity: 0.3;
        }

        .explored-not-visible {
            filter: brightness(0.5);
        }

        .unit-icon {
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #fff;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
        }

        .unit-icon.player-1 { border-color: #ff6b6b; color: #ff6b6b; }
        .unit-icon.player-2 { border-color: #4ecdc4; color: #4ecdc4; }
        .unit-icon.player-3 { border-color: #ffe66d; color: #ffe66d; }
        .unit-icon.player-4 { border-color: #a8e6cf; color: #a8e6cf; }

        .city-icon {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: gold;
            border: 1px solid #000;
            border-radius: 2px;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }

        .capital-star {
            background: #ffd700;
            color: #000;
        }

        .health-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #333;
        }

        .health-fill {
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-panel {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
        }

        .info-panel h3 {
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 10px 0;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 3px;
        }

        .action-display {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            border-left: 4px solid #4CAF50;
        }

        .action-type {
            font-size: 1.1rem;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .action-details {
            color: #bbb;
            font-size: 0.85rem;
        }

        .controls {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #667eea;
            color: white;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button.prev { background: #f39c12; }
        button.next { background: #27ae60; }

        .step-indicator {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .agent-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .agent-badge.player_0 { background: #ff6b6b; }
        .agent-badge.player_1 { background: #4ecdc4; }

        .legend {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 1px solid #333;
        }

        .tile-tooltip {
            position: fixed;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 1000;
            display: none;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ Polyterra Replay Viewer</h1>
        </div>

        <div class="file-selector">
            <input type="file" id="fileInput" class="file-input" accept=".json">
            <label for="fileInput" class="file-label">📁 Load Replay File</label>
            <p id="fileName" style="margin-top: 8px; opacity: 0.8; font-size: 0.9rem;"></p>
        </div>

        <div id="mainContent" class="main-content">
            <div class="game-view">
                <div class="map-container">
                    <div id="mapGrid" class="map-grid"></div>
                </div>
            </div>

            <div class="sidebar">
                <div class="info-panel">
                    <h3>Game State</h3>
                    <div class="step-indicator">
                        Step <span id="currentStep">0</span> / <span id="totalSteps">0</span>
                    </div>
                    <div>
                        Agent: <span id="currentAgent" class="agent-badge">-</span>
                    </div>
                    <div class="stat-grid">
                        <div class="stat-box">
                            <div class="stat-label">Turn</div>
                            <div class="stat-value" id="statTurn">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Currency</div>
                            <div class="stat-value" id="statCurrency">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Score</div>
                            <div class="stat-value" id="statScore">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Units</div>
                            <div class="stat-value" id="statUnits">0</div>
                        </div>
                    </div>

                    <div class="action-display">
                        <div class="action-type" id="actionType">-</div>
                        <div class="action-details" id="actionDetails"></div>
                        <div id="rewardDisplay" style="margin-top: 8px; font-weight: bold;"></div>
                    </div>
                </div>

                <div class="controls">
                    <h3>Controls</h3>
                    <div class="button-group">
                        <button id="btnPrev" class="prev">⬅️ Previous</button>
                        <button id="btnNext" class="next">Next ➡️</button>
                    </div>
                    <div class="button-group">
                        <button id="btnFirst">⏮️ First</button>
                        <button id="btnLast">Last ⏭️</button>
                    </div>
                    <div style="margin-top: 10px; font-size: 0.85rem; opacity: 0.7;">
                        Use arrow keys: ← →
                    </div>
                </div>

                <div class="legend">
                    <h3>Legend</h3>
                    <div class="legend-item">
                        <div class="legend-color terrain-3"></div>
                        <span>Field</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color terrain-5"></div>
                        <span>Forest</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color terrain-4"></div>
                        <span>Mountain</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color terrain-1"></div>
                        <span>Water</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #1a1a1a; opacity: 0.3;"></div>
                        <span>Unexplored (Fog)</span>
                    </div>
                    <hr style="margin: 10px 0; border: none; border-top: 1px solid #333;">
                    <div style="margin-top: 8px; font-size: 0.8rem;">
                        <div>🔴 Unit icon: Has unit</div>
                        <div>🟡 Corner: City/Capital</div>
                        <div>Colored border: Owned tile</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="tooltip" class="tile-tooltip"></div>

    <script>
        const TERRAIN_NAMES = ['None', 'Water', 'Ocean', 'Field', 'Mountain', 'Forest', 'Ice'];
        const UNIT_SYMBOLS = {
            0: '?',  // Unknown
            1: '⚔️', // Warrior
            2: '🏹', // Archer
            3: '🔱', // Rider
            4: '⛵', // Boat
        };

        let replayData = null;
        let currentStepIndex = 0;
        let mapSize = 15;

        document.getElementById('fileInput').addEventListener('change', handleFileSelect);
        document.getElementById('btnFirst').addEventListener('click', () => goToStep(0));
        document.getElementById('btnPrev').addEventListener('click', () => goToStep(currentStepIndex - 1));
        document.getElementById('btnNext').addEventListener('click', () => goToStep(currentStepIndex + 1));
        document.getElementById('btnLast').addEventListener('click', () => goToStep(replayData.steps.length - 1));

        document.addEventListener('keydown', (e) => {
            if (!replayData) return;
            if (e.key === 'ArrowLeft') goToStep(currentStepIndex - 1);
            if (e.key === 'ArrowRight') goToStep(currentStepIndex + 1);
        });

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileName').textContent = `Loading ${file.name}...`;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    replayData = JSON.parse(e.target.result);
                    document.getElementById('fileName').textContent = `✅ Loaded: ${file.name}`;
                    loadReplay();
                } catch (err) {
                    alert('Error loading replay: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function loadReplay() {
            if (!replayData) return;

            // Detect map size from first step
            if (replayData.steps.length > 0 && replayData.steps[0].observation.tiles) {
                const tiles = replayData.steps[0].observation.tiles;
                const maxX = Math.max(...tiles.map(t => t.x));
                const maxY = Math.max(...tiles.map(t => t.y));
                mapSize = Math.max(maxX, maxY) + 1;
            }

            // Create map grid
            const mapGrid = document.getElementById('mapGrid');
            mapGrid.style.gridTemplateColumns = `repeat(${mapSize}, 40px)`;
            mapGrid.innerHTML = '';

            for (let y = 0; y < mapSize; y++) {
                for (let x = 0; x < mapSize; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'map-tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    tile.addEventListener('mouseenter', showTileTooltip);
                    tile.addEventListener('mouseleave', hideTooltip);
                    mapGrid.appendChild(tile);
                }
            }

            document.getElementById('totalSteps').textContent = replayData.steps.length;
            document.getElementById('mainContent').classList.add('active');

            goToStep(0);
        }

        function goToStep(index) {
            if (!replayData) return;
            if (index < 0 || index >= replayData.steps.length) return;

            currentStepIndex = index;
            const step = replayData.steps[index];
            const obs = step.observation;

            // Update step indicator
            document.getElementById('currentStep').textContent = index + 1;

            // Update agent
            const agentBadge = document.getElementById('currentAgent');
            agentBadge.textContent = step.agent;
            agentBadge.className = `agent-badge ${step.agent}`;

            // Update stats
            document.getElementById('statTurn').textContent = obs.turn;
            document.getElementById('statCurrency').textContent = obs.currency;
            document.getElementById('statScore').textContent = obs.score.toLocaleString();
            document.getElementById('statUnits').textContent = obs.num_units;

            // Update action
            document.getElementById('actionType').textContent = step.action.type;
            let details = [];
            if (step.action.target) {
                details.push(`Target: (${step.action.target[0]}, ${step.action.target[1]})`);
            }
            if (step.action.unit_idx !== null && step.action.unit_idx !== undefined) {
                details.push(`Unit: #${step.action.unit_idx}`);
            }
            document.getElementById('actionDetails').textContent = details.join(' | ');

            // Update reward
            const rewardDiv = document.getElementById('rewardDisplay');
            if (step.reward !== 0) {
                rewardDiv.textContent = `Reward: ${step.reward > 0 ? '+' : ''}${step.reward.toFixed(1)}`;
                rewardDiv.style.color = step.reward > 0 ? '#4CAF50' : '#e74c3c';
            } else {
                rewardDiv.textContent = '';
            }

            // Update map
            renderMap(obs.tiles);

            // Update button states
            document.getElementById('btnFirst').disabled = index === 0;
            document.getElementById('btnPrev').disabled = index === 0;
            document.getElementById('btnNext').disabled = index === replayData.steps.length - 1;
            document.getElementById('btnLast').disabled = index === replayData.steps.length - 1;
        }

        function renderMap(tiles) {
            // Create tile lookup
            const tileMap = {};
            for (const tile of tiles) {
                tileMap[`${tile.x},${tile.y}`] = tile;
            }

            // Update each tile
            const mapGrid = document.getElementById('mapGrid');
            const tileDivs = mapGrid.children;

            for (const tileDiv of tileDivs) {
                const x = parseInt(tileDiv.dataset.x);
                const y = parseInt(tileDiv.dataset.y);
                const tile = tileMap[`${x},${y}`];

                // Clear previous state
                tileDiv.className = 'map-tile';
                tileDiv.innerHTML = '';

                if (!tile) continue;

                // Terrain
                tileDiv.classList.add(`terrain-${tile.terrain}`);

                // Fog of war
                if (!tile.explored) {
                    tileDiv.classList.add('unexplored');
                } else if (!tile.visible) {
                    tileDiv.classList.add('explored-not-visible');
                }

                // Owner
                if (tile.owner > 0 && tile.owner <= 4) {
                    tileDiv.classList.add(`owner-${tile.owner}`);
                }

                // Unit
                if (tile.has_unit && tile.explored) {
                    const unitIcon = document.createElement('div');
                    unitIcon.className = `unit-icon player-${tile.unit_owner}`;
                    unitIcon.textContent = UNIT_SYMBOLS[tile.unit_type] || '🔷';

                    // Health bar
                    if (tile.unit_health > 0) {
                        const healthBar = document.createElement('div');
                        healthBar.className = 'health-bar';
                        const healthFill = document.createElement('div');
                        healthFill.className = 'health-fill';
                        healthFill.style.width = `${tile.unit_health}%`;
                        healthBar.appendChild(healthFill);
                        unitIcon.appendChild(healthBar);
                    }

                    tileDiv.appendChild(unitIcon);
                }

                // City/Capital
                if (tile.is_capital && tile.explored) {
                    const cityIcon = document.createElement('div');
                    cityIcon.className = 'city-icon capital-star';
                    cityIcon.textContent = '★';
                    tileDiv.appendChild(cityIcon);
                } else if (tile.improvement_type > 0 && tile.explored) {
                    const cityIcon = document.createElement('div');
                    cityIcon.className = 'city-icon';
                    cityIcon.textContent = '🏛️';
                    tileDiv.appendChild(cityIcon);
                }

                // Store tile data for tooltip
                tileDiv.dataset.tileData = JSON.stringify(tile);
            }
        }

        function showTileTooltip(event) {
            const tileDiv = event.target.closest('.map-tile');
            if (!tileDiv || !tileDiv.dataset.tileData) return;

            const tile = JSON.parse(tileDiv.dataset.tileData);
            const tooltip = document.getElementById('tooltip');

            let content = `<strong>(${tile.x}, ${tile.y})</strong><br>`;
            content += `Terrain: ${TERRAIN_NAMES[tile.terrain]}<br>`;

            if (!tile.explored) {
                content += `<em>Unexplored</em>`;
            } else {
                if (tile.owner > 0) {
                    content += `Owner: Player ${tile.owner}<br>`;
                }
                if (tile.has_unit) {
                    content += `Unit: Player ${tile.unit_owner}<br>`;
                    content += `Health: ${tile.unit_health.toFixed(0)}%<br>`;
                }
                if (tile.is_capital) {
                    content += `<strong>CAPITAL</strong><br>`;
                }
            }

            tooltip.innerHTML = content;
            tooltip.style.display = 'block';
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY + 15) + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }
    </script>
</body>
</html>
