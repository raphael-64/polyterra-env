[project]
name = "polyterra-env"
version = "0.1.0"
description = "PettingZoo environment for Polytopia-style multi-agent reinforcement learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pettingzoo>=1.25.0",
    "gymnasium>=0.29.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
training = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "wandb>=0.24.1",
    "sb3-contrib>=2.7.1",
    "tensorboard>=2.20.0",
    "ray>=2.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyterra_env"]

[tool.hatch.build.targets.wheel.force-include]
"src/polyterra_env/backend" = "polyterra_env/backend"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "wandb>=0.24.1",
    "sb3-contrib>=2.7.1",
    "tensorboard>=2.20.0",
    "ray>=2.53.0",
]
